name: Render Review

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'app/src/scenes/**'
      - 'app/src/motifs/**'
      - 'app/src/timeline.ts'
      - 'app/scripts/render-review.ts'
      - '.github/workflows/render-review.yml'

permissions:
  contents: read

concurrency:
  group: render-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Render review sheets
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: app
        run: bun install

      - name: Validate preview
        working-directory: app
        run: bun run check

      - name: Render review sheets
        working-directory: app
        run: bun run render:review

      - name: Upload review sheets
        uses: actions/upload-artifact@v4
        with:
          name: shore-review-${{ github.sha }}
          path: out/review/*.png
          if-no-files-found: error
          retention-days: 14
