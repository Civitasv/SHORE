<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SHORE — NO SHORE</title>
  </head>
  <body>
    <main id="app">
      <canvas id="film" aria-label="SHORE film preview"></canvas>
      <section id="transport" aria-label="Film transport">
        <div class="transport-row">
          <button id="play" type="button" aria-label="Play or pause">PLAY</button>
          <div class="readout">
            <strong id="scene">BOOT</strong>
            <span id="time">00:00.000</span>
          </div>
        </div>
        <input id="scrub" type="range" min="0" max="240" step="0.001" value="0" aria-label="Timeline" />
        <div class="hint">SPACE play · ←/→ seek · ,/. frame · [/] plate · L loop · H hide</div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
